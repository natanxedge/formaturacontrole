<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Formandos</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alpha+Slab+One&family=Montserrat:wght@800&display=swap"
        rel="stylesheet">

    <!-- CSS próprio (logo e barra de rolagem) -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-gray-100 min-h-screen">

    <main class="max-w-4xl mx-auto">

        <header>

            <div class="bg-blue-800 text-white px-4 py-5 md:px-6">

                <div class="flex items-center gap-5">

                    <div class="spin-logo">
                        <div class="spin-logo__name">SPIN</div>
                        <div class="spin-logo__subtitle">EDUCACIONAL</div>
                    </div>

                    <div class="min-w-0">
                        <h1 class="text-xl md:text-2xl font-bold">
                            Controle de Formandos
                        </h1>

                        <p class="text-blue-100 text-xs md:text-sm mt-1">
                            Alunos, contatos, atendimento e pagamentos
                        </p>
                    </div>

                </div>

            </div>

            <div class="bg-rose-800 text-white px-3 py-2">

                <div class="flex items-center gap-2 md:gap-4 min-w-0">

                    <div class="flex-1 min-w-0">
                        <div id="filtro-anos"
                            class="flex items-center gap-1.5 overflow-x-auto whitespace-nowrap">
                        </div>
                    </div>

                    <div class="shrink-0">

                        <p class="text-[10px] font-semibold uppercase text-rose-100 text-center mb-1">
                            Unidade
                        </p>

                        <div id="filtro-unidades"
                            class="inline-flex bg-rose-950 rounded-md p-0.5 gap-0.5">

                            <button type="button" data-unidade="1N"
                                class="px-2 py-1 text-xs font-semibold rounded transition">
                                1N
                            </button>

                            <button type="button" data-unidade="RO"
                                class="px-2 py-1 text-xs font-semibold rounded transition">
                                RO
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </header>

        <div class="px-4 pt-4 md:px-6">

            <div class="flex flex-wrap items-center gap-3 mb-4">

                <button id="atualizar-lista" type="button"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg text-sm transition">
                    Atualizar lista
                </button>

                <span id="estado-conexao"
                    class="text-xs text-gray-600"
                    role="status">
                    Carregando alunos...
                </span>

            </div>

        </div>

        <div id="lista-formandos"
            class="space-y-6 px-4 pb-6 md:px-6">
        </div>

    </main>

    <!-- Scripts: a ordem importa (cada arquivo usa o que veio antes) -->
    <script src="js/config.js"></script>
    <script src="js/estado.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/classes.js"></script>
    <script src="js/templates.js"></script>
    <script src="js/api.js"></script>
    <script src="js/filtros.js"></script>
    <script src="js/render.js"></script>
    <script src="js/whatsapp.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
