<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Formandos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-4 md:p-8">
    <main class="max-w-4xl mx-auto">
        <header class="mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Controle de Formandos</h1>
            <p class="text-gray-500 mt-1">Alunos, contatos, atendimento e pagamentos</p>
            <div class="mt-4 flex flex-wrap items-center gap-3">
                <button id="atualizar-lista" type="button"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg">
                    Atualizar lista
                </button>
                <span id="estado-conexao" class="text-sm text-gray-600" role="status">Carregando alunos...</span>
            </div>
        </header>

        <div id="lista-formandos" class="space-y-6"></div>
    </main>

    <script>
        // URL do Web App do Google Apps Script
        const API_URL = "https://script.google.com/macros/s/AKfycbynHPP03YCpveD0LD2R02ViTvAQP-a2rDD1GtrhI7UlLIMXBpcmGu2MBQXD5L77t_BH/exec";

        const mensagemPadrao =
            "Olá! Estamos entrando em contato sobre a formatura escolar. Tudo bem?";

        let alunos = [];
        let alunoAberto = null;

        const container = document.getElementById("lista-formandos");
        const estadoConexao = document.getElementById("estado-conexao");

        function escaparHTML(valor) {
            return String(valor ?? "").replace(/[&<>"']/g, caractere => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[caractere]);
        }

        function obterAno(turma) {
            const valor = String(turma ?? "").trim();
            if (!valor) return "Sem ano";
            if (/^\d{4,}$/.test(valor)) return String(Number(valor[0]));
            const numero = Number(valor);
            return Number.isFinite(numero) ? String(Math.floor(numero / 100)) : "Sem ano";
        }

        function normalizarTelefone(telefone) {
            let numero = String(telefone ?? "").replace(/\D/g, "");
            if (numero && !numero.startsWith("55")) numero = "55" + numero;
            return numero;
        }

        function gerarLink(telefone, mensagem = "") {
            const numero = normalizarTelefone(telefone);
            if (!numero) return "#";
            if (!mensagem) return `https://wa.me/${numero}`;
            const texto = encodeURIComponent(mensagem).replace(/%20/g, "+");
            return `https://wa.me/${numero}?text=${texto}`;
        }

        async function carregarAlunos() {
            estadoConexao.textContent = "Carregando alunos da planilha...";
            container.innerHTML = "";

            try {
                const response = await fetch(`${API_URL}?acao=listar`);

                if (!response.ok) {
                    throw new Error("Falha na resposta do servidor");
                }

                const resposta = await response.json();

                if (!resposta || resposta.sucesso !== true || !Array.isArray(resposta.alunos)) {
                    estadoConexao.textContent = resposta?.erro || "A API retornou uma resposta inválida.";
                    return;
                }

                alunos = resposta.alunos.map(aluno => ({
                    id: String(aluno.id ?? ""),
                    nome: aluno.nome ?? "",
                    telefone1: aluno.telefone1 ?? "",
                    telefone2: aluno.telefone2 ?? "",
                    telefones: Array.isArray(aluno.telefones)
                        ? aluno.telefones.filter(Boolean)
                        : [aluno.telefone1, aluno.telefone2].filter(Boolean),
                    responsavel: aluno.responsavel ?? "",
                    turma: String(aluno.turma ?? ""),
                    unidade: aluno.unidade ?? "",
                    atendimento: aluno.atendimento || "tratamento",
                    pagamento: aluno.pagamento || "pendente"
                }));

                renderizarLista();
                estadoConexao.textContent = `${alunos.length} aluno(s) carregado(s) da planilha.`;
            } catch (erro) {
                console.error(erro);
                estadoConexao.textContent = "Erro ao acessar o Apps Script. Confira a URL e a implantação.";
            }
        }

        function renderizarLista() {
            container.innerHTML = "";
            alunoAberto = null;

            if (alunos.length === 0) {
                container.innerHTML = `
          <div class="bg-white border border-gray-200 rounded-xl p-6 text-center text-gray-600">
            Nenhum formando encontrado na planilha.
          </div>`;
                return;
            }

            const anos = {};
            alunos.forEach((aluno, index) => {
                const ano = obterAno(aluno.turma);
                if (!anos[ano]) anos[ano] = [];
                anos[ano].push({ ...aluno, index });
            });

            Object.keys(anos).sort((a, b) => {
                if (a === "Sem ano") return 1;
                if (b === "Sem ano") return -1;
                return Number(a) - Number(b);
            }).forEach(ano => {
                const cardAno = document.createElement("section");
                cardAno.className = "bg-white rounded-xl shadow-sm border border-gray-200 p-5";
                const tituloAno = ano === "Sem ano" ? ano : `${ano}º Ano`;

                cardAno.innerHTML = `
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-bold text-gray-800">${escaparHTML(tituloAno)}</h2>
            <span class="text-sm bg-blue-100 text-blue-700 px-3 py-1 rounded-full">
              ${anos[ano].length} aluno(s)
            </span>
          </div>
          <div class="space-y-3" data-lista-ano></div>
        `;
                container.appendChild(cardAno);

                const lista = cardAno.querySelector("[data-lista-ano]");

                anos[ano].forEach(aluno => {
                    const cartao = document.createElement("article");
                    cartao.className = "border border-gray-200 rounded-lg overflow-hidden";

                    cartao.innerHTML = `
            <button type="button" onclick="alternarAluno(${aluno.index})"
              class="w-full flex justify-between items-center p-4 text-left hover:bg-gray-50 transition">
              <span class="font-semibold text-gray-800">${escaparHTML(aluno.nome)}</span>
              <span id="icone-${aluno.index}" class="text-gray-500 text-xl">+</span>
            </button>

            <div id="detalhes-${aluno.index}" class="hidden border-t border-gray-200 p-4 bg-gray-50">
              <div class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <p class="text-xs text-gray-500 uppercase font-semibold">Responsável</p>
                    <p class="text-gray-800">${escaparHTML(aluno.responsavel || "Não informado")}</p>
                  </div>
                  <div>
                    <p class="text-xs text-gray-500 uppercase font-semibold">Turma</p>
                    <p class="text-gray-800">${escaparHTML(aluno.turma || "Não informada")}</p>
                  </div>
                  <div>
                    <p class="text-xs text-gray-500 uppercase font-semibold">Unidade</p>
                    <p class="text-gray-800">${escaparHTML(aluno.unidade || "Não informada")}</p>
                  </div>
                  <div>
                    <p class="text-xs text-gray-500 uppercase font-semibold">ID</p>
                    <p class="text-gray-800">${escaparHTML(aluno.id)}</p>
                  </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <label class="block">
                    <span class="text-xs text-gray-500 uppercase font-semibold">Atendimento</span>
                    <select id="atendimento-${aluno.index}" onchange="salvarStatus(${aluno.index}, 'atendimento', this.value)"
                      class="mt-1 w-full border border-gray-300 rounded-lg p-2 bg-white">
                      <option value="tratamento" ${aluno.atendimento === "tratamento" ? "selected" : ""}>Em tratamento</option>
                      <option value="resolvido" ${aluno.atendimento === "resolvido" ? "selected" : ""}>Resolvido</option>
                    </select>
                  </label>
                  <label class="block">
                    <span class="text-xs text-gray-500 uppercase font-semibold">Pagamento</span>
                    <select id="pagamento-${aluno.index}" onchange="salvarStatus(${aluno.index}, 'pagamento', this.value)"
                      class="mt-1 w-full border border-gray-300 rounded-lg p-2 bg-white">
                      <option value="pendente" ${aluno.pagamento === "pendente" ? "selected" : ""}>Pendente</option>
                      <option value="pago" ${aluno.pagamento === "pago" ? "selected" : ""}>Pago</option>
                    </select>
                  </label>
                </div>

                <div>
                  <p class="text-xs text-gray-500 uppercase font-semibold mb-2">Telefone para contato</p>
                  <div class="space-y-2" id="telefones-${aluno.index}"></div>
                </div>

                <div>
                  <label class="flex items-center gap-2 text-sm text-gray-700 mb-3">
                    <input type="checkbox" id="usar-mensagem-${aluno.index}" checked
                      onchange="atualizarMensagem(${aluno.index})" class="w-4 h-4 accent-blue-600">
                    Utilizar mensagem com texto
                  </label>
                  <textarea id="mensagem-${aluno.index}" rows="3"
                    oninput="atualizarMensagem(${aluno.index})"
                    class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">${escaparHTML(mensagemPadrao)}</textarea>
                </div>

                <div class="flex flex-col sm:flex-row gap-2">
                  <a id="whatsapp-${aluno.index}" href="#" target="_blank" rel="noopener noreferrer"
                    class="flex-1 text-center bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition">
                    Abrir WhatsApp
                  </a>
                  <button type="button" onclick="abrirWhatsApp(${aluno.index}, false)"
                    class="flex-1 border border-gray-300 hover:bg-gray-100 text-gray-700 font-semibold py-3 rounded-lg transition">
                    Somente telefone
                  </button>
                </div>
                <p id="status-salvamento-${aluno.index}" class="text-xs text-gray-500" aria-live="polite"></p>
              </div>
            </div>
          `;

                    lista.appendChild(cartao);

                    const listaTelefones = cartao.querySelector(`#telefones-${aluno.index}`);
                    aluno.telefones.forEach((telefone, i) => {
                        const numero = normalizarTelefone(telefone);
                        const opcao = document.createElement("label");
                        opcao.className = "flex items-center gap-3 bg-white border border-gray-200 rounded-lg p-3 cursor-pointer hover:border-blue-400";
                        opcao.innerHTML = `
              <input type="radio" name="telefone-${aluno.index}" value="${escaparHTML(telefone)}"
                ${i === 0 ? "checked" : ""} onchange="atualizarMensagem(${aluno.index})"
                class="w-4 h-4 accent-blue-600">
              <span class="text-sm text-gray-700">+${escaparHTML(numero)}</span>
            `;
                        listaTelefones.appendChild(opcao);
                    });

                    if (aluno.telefones.length === 0) {
                        listaTelefones.innerHTML = '<p class="text-sm text-gray-500">Nenhum telefone cadastrado.</p>';
                    }

                    atualizarMensagem(aluno.index);
                });
            });
        }

        function alternarAluno(index) {
            if (alunoAberto !== null) {
                document.getElementById(`detalhes-${alunoAberto}`)?.classList.add("hidden");
                const iconeAnterior = document.getElementById(`icone-${alunoAberto}`);
                if (iconeAnterior) iconeAnterior.textContent = "+";
            }

            if (alunoAberto === index) {
                alunoAberto = null;
            } else {
                alunoAberto = index;
                document.getElementById(`detalhes-${index}`)?.classList.remove("hidden");
                document.getElementById(`icone-${index}`).textContent = "−";
            }
        }

        function atualizarMensagem(index) {
            const telefone = document.querySelector(`input[name="telefone-${index}"]:checked`);
            const link = document.getElementById(`whatsapp-${index}`);
            if (!telefone || !link) {
                if (link) link.href = "#";
                return;
            }

            const usarMensagem = document.getElementById(`usar-mensagem-${index}`).checked;
            const mensagem = document.getElementById(`mensagem-${index}`).value;
            link.href = gerarLink(telefone.value, usarMensagem ? mensagem : "");
        }

        function abrirWhatsApp(index, comMensagem) {
            const telefone = document.querySelector(`input[name="telefone-${index}"]:checked`);
            if (!telefone) {
                alert("Este aluno não possui telefone cadastrado.");
                return;
            }

            const mensagem = comMensagem
                ? document.getElementById(`mensagem-${index}`).value
                : "";

            window.open(gerarLink(telefone.value, mensagem), "_blank", "noopener");
        }

        async function salvarStatus(index, campo, valor) {
            const aluno = alunos[index];
            const aviso = document.getElementById(`status-salvamento-${index}`);
            const valoresPermitidos = {
                atendimento: ["tratamento", "resolvido"],
                pagamento: ["pendente", "pago"]
            };

            if (!aluno || !valoresPermitidos[campo]?.includes(valor)) return;

            aviso.textContent = "Enviando alteração...";
            try {
                await fetch(API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        acao: "atualizarStatus",
                        id: aluno.id,
                        campo,
                        valor
                    })
                });

                aviso.textContent = "Solicitação enviada. Atualize a lista para conferir se a planilha recebeu a alteração.";
            } catch (erro) {
                aviso.textContent = "Não foi possível enviar. Verifique sua conexão.";
            }
        }

        document.getElementById("atualizar-lista").addEventListener("click", carregarAlunos);

        carregarAlunos();
    </script>
</body>

</html>
